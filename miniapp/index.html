<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D3CFF">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Знания">

<title>FinLab Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface2:#EAECF3; --line:#DDE0EA;
  --fg:#0B0D17; --fg2:#4A5068; --fg3:#7A8099;
  --tint:#2D3CFF; --tint-ink:#FFFFFF; --tint-soft:#E4E7FF;
  --ok:#0E9F5B; --ok-soft:#DDF6E9; --bad:#E5303F; --bad-soft:#FDE4E7; --warm:#F29B0B; --warm-soft:#FFF0D2;
  --shadow:0 1px 2px rgba(11,13,23,.06),0 8px 24px rgba(11,13,23,.06);
  --display:"Unbounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r:20px; --r-sm:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07080D; --surface:#12141C; --surface2:#1B1E29; --line:#262A38;
  --fg:#F2F4FA; --fg2:#A9AFC6; --fg3:#7C839D;
  --tint:#6B7BFF; --tint-ink:#07080D; --tint-soft:#1C2150;
  --ok:#35D488; --ok-soft:#0F2A1E; --bad:#FF6B78; --bad-soft:#341319; --warm:#FFB547; --warm-soft:#33250C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07080D; --surface:#12141C; --surface2:#1B1E29; --line:#262A38;
  --fg:#F2F4FA; --fg2:#A9AFC6; --fg3:#7C839D;
  --tint:#6B7BFF; --tint-ink:#07080D; --tint-soft:#1C2150;
  --ok:#35D488; --ok-soft:#0F2A1E; --bad:#FF6B78; --bad-soft:#341319; --warm:#FFB547; --warm-soft:#33250C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 17px/1.5 var(--ui);margin:0;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--display);letter-spacing:-.02em;font-weight:700;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.rail{display:none}
.main{width:100%;max-width:680px;margin:0 auto;padding-block:20px 120px;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;color:var(--fg3);font-size:11px;font-weight:600;position:relative}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--tint)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
@media(min-width:900px){
  body{padding-left:0;padding-right:0}
  .shell{grid-template-columns:260px 1fr}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.03em;margin-bottom:22px}
  .rail .brand b{color:var(--tint)}
  .rail .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:16px;padding:10px 14px;border-radius:14px}
  .rail .tab[aria-selected="true"]{background:var(--tint-soft)}
  .tabbar{display:none}
  .main{padding-inline:24px;padding-block:40px 80px}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3)}
.title{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,38px);letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--fg2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--fg3);display:inline-block}
.chip.ok i{background:var(--ok)} .chip.warn i{background:var(--warm)} .chip.bad i{background:var(--bad)}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.hero{background:var(--tint);color:var(--tint-ink);border-radius:28px;padding:24px;position:relative;overflow:hidden;box-shadow:0 14px 40px color-mix(in srgb,var(--tint) 35%,transparent)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h2{font-family:var(--display);font-size:clamp(22px,5.5vw,28px);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:8px 0 10px;text-wrap:balance;position:relative}
.hero p{opacity:.92;position:relative;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:25px;font-weight:700;font-size:17px;background:var(--tint);color:var(--tint-ink);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)} .btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.inv{background:var(--tint-ink);color:var(--tint)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.block{width:100%}
.hero .btn{margin-top:18px;position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:700}
.stat span{font-size:12px;color:var(--fg3);font-weight:600}
.week{margin-top:24px}
.week h3{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3);margin-bottom:10px;font-weight:700}
.lrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px}
.lrow[disabled]{opacity:.55;cursor:default}
.lnum{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px}
.lrow.done .lnum{background:var(--ok-soft);color:var(--ok)}
.lrow.next .lnum{background:var(--tint);color:var(--tint-ink)}
.lt{font-weight:600;font-size:16px;line-height:1.3}
.ls{font-size:13px;color:var(--fg3)}
.bchip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--tint-soft);color:var(--tint);margin-right:6px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tint);border-radius:5px;transition:width .4s}
.bar.ok>i{background:var(--ok)}
.empty{text-align:center;padding:36px 20px;color:var(--fg2)}
.empty .disp{font-size:20px;color:var(--fg);margin-bottom:8px}

/* player */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}.player.enter{animation:push .25s ease-out}
@keyframes push{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.player,.bar>i{animation:none;transition:none}}
.phead{padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:680px;width:100%;margin:0 auto}
.seg{display:flex;gap:4px;margin-top:10px}
.seg i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.seg i.on{background:var(--tint)}
.pbody{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.pin{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pfoot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.pfoot .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.x{width:44px;height:44px;border-radius:22px;background:var(--surface2);display:grid;place-items:center;font-size:20px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tint)}
.h{font-family:var(--display);font-weight:700;font-size:clamp(24px,6vw,30px);letter-spacing:-.025em;line-height:1.12;text-wrap:balance}
.lead{font-size:18px;color:var(--fg2)}
.p{color:var(--fg)} .p b{font-weight:700}
.callout{border-radius:var(--r-sm);padding:16px;background:var(--tint-soft);border:1px solid color-mix(in srgb,var(--tint) 25%,transparent)}
.callout.warm{background:var(--warm-soft);border-color:color-mix(in srgb,var(--warm) 35%,transparent)}
.callout.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.callout.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.callout .eyebrow{color:inherit;opacity:.75;margin-bottom:4px}
.formula{font-family:var(--display);font-size:clamp(18px,5vw,24px);font-weight:600;text-align:center;padding:18px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-sm);overflow-x:auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:52px;padding:12px 16px;border-radius:var(--r-sm);background:var(--surface);border:2px solid var(--line);text-align:left;font-weight:600;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--tint)}
.opt.sel{border-color:var(--tint);background:var(--tint-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--fg2);display:flex;justify-content:space-between}
.field label output{color:var(--tint);font-family:var(--display);font-size:14px}
input[type=range]{width:100%;height:44px;accent-color:var(--tint);background:transparent}
input[type=text],input[type=number],textarea{width:100%;min-height:52px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--surface);padding:0 16px;font:600 20px var(--ui);color:var(--fg)}
textarea{padding:14px 16px;min-height:120px;font:400 16px/1.5 var(--ui);resize:vertical}
.big{font-family:var(--display);font-size:clamp(30px,9vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
.mini span{font-size:12px;color:var(--fg3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mini b{display:block;font-family:var(--display);font-size:20px;margin-top:4px}
svg.chart{width:100%;height:180px;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);border:2px solid var(--line);width:100%;text-align:left;min-height:52px}
.check .bx{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--fg3);display:grid;place-items:center;font-size:16px;line-height:1}
.check.on{border-color:var(--ok);background:var(--ok-soft)} .check.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.fc{perspective:900px;min-height:260px}
.fc .face{min-height:260px;border-radius:24px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%}
.fc .face.back{background:var(--tint);color:var(--tint-ink)}
.fc .face .disp{font-size:22px}
.links a{display:block;padding:14px 16px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;margin-bottom:8px}
.links a b{display:block} .links a span{font-size:13px;color:var(--fg3)}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:22px;font-weight:600;font-size:15px;z-index:80;max-width:90vw}
.hm{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.hm i{aspect-ratio:1;border-radius:5px;background:var(--surface2);display:block}
.hm i.d{background:var(--ok)} .hm i.w{background:var(--warm)} .hm i.n{outline:2px solid var(--tint)}
.bl{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:14px;font-weight:600;margin-bottom:10px}
.bl small{color:var(--fg3);text-align:right}

.rh{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.2;margin-top:8px;text-wrap:balance}
.rt{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--fg2);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.read p{margin:0;font-size:18px;line-height:1.6}
.read ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:18px;line-height:1.55}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:15px;min-width:300px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.hl{color:var(--tint);font-weight:700}

/* ===== задания ===== */
.opt.part{border-color:var(--warm);background:var(--warm-soft)}
.opt small.why,.check small.why{display:block;font-weight:400;font-size:14px;color:var(--fg2);margin-top:6px;line-height:1.4}
.qq{font-size:19px;font-weight:700;line-height:1.35}
.tfr{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:10px}
.tfr.ok{border-color:var(--ok)} .tfr.bad{border-color:var(--bad)}
.tft{font-weight:600;line-height:1.4}
.check.badc{border-color:var(--bad);background:var(--bad-soft)} .check.badc .bx{background:var(--bad);border-color:var(--bad);color:#fff}
.check[disabled]{cursor:default}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mc{display:flex;flex-direction:column;gap:8px}.mc .opt{min-height:56px;font-size:15px}
.ord{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-sm);font-weight:600}
.orow.good{border-color:var(--ok);background:var(--ok-soft)}.orow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mv{width:44px;height:44px;border-radius:12px;background:var(--surface2);font-size:16px}.mv[disabled]{opacity:.3}
.sortcard{text-align:center;padding:28px 18px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.bin{min-height:56px;font-weight:700}
.est{display:flex;flex-direction:column;gap:6px}.estv{font-family:var(--display);font-size:clamp(30px,9vw,44px);font-weight:800;text-align:center;color:var(--tint)}
.vrow{display:flex;flex-wrap:wrap;gap:8px}.vch{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column}.vch small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}.vch b{font-family:var(--display);font-size:18px}
.hack{background:linear-gradient(145deg,var(--warm),#F26B0B);color:#1B1100;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
.hack .eyebrow{color:inherit;opacity:.7}.hname{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,36px);letter-spacing:-.03em;line-height:1.05}
.hform{font-family:var(--display);font-weight:700;font-size:clamp(18px,5vw,24px);background:rgba(255,255,255,.55);border-radius:14px;padding:14px;text-align:center}
.hl{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.trow{border-style:dashed}.trow .lnum{background:var(--warm-soft);color:var(--warm)}
.pfoot .btn{white-space:nowrap}.pfoot .btn.block{white-space:normal}
</style></head><body>
<div class="shell"><nav class="rail" id="rail" aria-label="Разделы"></nav><main class="main" id="view"></main></div>
<nav class="tabbar" id="tabbar" aria-label="Разделы"></nav><div id="layer"></div>

let INDEX={available:[1],cards:{}};

/* ===== STATE & SYNC ===== */
let S=store.get("fl_state",{events:[],synced:[],cards:{}});
let CFG=store.get("fl_cfg",{url:"",token:""});
const save=()=>store.set("fl_state",S);
let syncStatus="off",syncMsg="Только на этом устройстве",syncing=false;
function setSync(st,msg){syncStatus=st;syncMsg=msg;const c=$("#syncchip");if(c){c.className="chip "+st;c.lastChild.textContent=" "+msg}}
const syncChip=()=>`<button class="chip ${syncStatus}" id="syncchip" onclick="go('stat')"><i></i> ${esc(syncMsg)}</button>`;
function addEvent(type,lesson,detail,score,max,sec){const row=[nowMsk(),type,lesson,detail,score,max,sec||""];S.events.push(row);save();flush();return row}
async function flush(){
  if(!CFG.url||syncing)return;
  const todo=S.events.filter(r=>!S.synced.includes(key(r)));
  if(!todo.length)return;
  syncing=true;
  try{
    const r=await fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:CFG.token,rows:todo})});
    const j=await r.json();
    if(j.ok){todo.forEach(x=>S.synced.push(key(x)));save();setSync("ok","Записано в таблицу")}else setSync("bad","Таблица: неверный токен")
  }catch(e){setSync("warn","Нет связи с таблицей, повторю позже")}
  syncing=false;
}
async function pull(){
  if(!CFG.url){setSync("off","Таблица не подключена");return}
  try{
    const r=await fetch(CFG.url+(CFG.url.includes("?")?"&":"?")+"token="+encodeURIComponent(CFG.token));
    const j=await r.json();
    if(j.error){setSync("bad","Таблица: неверный токен");return}
    const have=new Set(S.events.map(key));
    (j.rows||[]).forEach(v=>{const r=[String(v[0]),v[1],Number(v[2])||v[2],v[3],v[4]===""?"":Number(v[4]),v[5]===""?"":Number(v[5]),v[6]];const k=key(r);if(!have.has(k)){S.events.push(r);have.add(k)}if(!S.synced.includes(k))S.synced.push(k)});
    S.events.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));save();
    setSync("ok","Таблица подключена");await flush();render();
  }catch(e){setSync("warn","Нет связи с таблицей")}
}
function saveCfg(){CFG={url:$("#cfgurl").value.trim(),token:$("#cfgtok").value.trim()};store.set("fl_cfg",CFG);setSync("","Подключаю…");pull()}

function tests(n){return S.events.filter(r=>r[1]==="Тест"&&Number(r[2])===n)}
function best(n){const t=tests(n);if(!t.length)return null;return Math.max(...t.map(r=>r[4]/r[5]))}
const passed=n=>{const b=best(n);return b!==null&&b>=.7};
const taken=n=>best(n)!==null;
function tests2(type,id){return S.events.filter(r=>r[1]===type&&Number(r[2])===id)}
function tbest(type,id){const t=tests2(type,id);return t.length?Math.max(...t.map(r=>r[4]/r[5])):null}
const tpassed=(type,id)=>{const b=tbest(type,id);return b!==null&&b>=.7};
const rangeReady=(a,b)=>{for(let n=a;n<=b;n++)if(!hasContent(n))return false;return true};
function pendingTest(){for(let w=1;w<=12;w++){if(!taken(w*5))return null;if(!tpassed("Недельный",w))return ["Недельный",w];if(w%2===0&&!tpassed("Итоговый",w/2))return ["Итоговый",w/2]}return null}
function days(){return [...new Set(S.events.map(r=>String(r[0]).slice(0,10)))].sort()}
function streak(){const ds=new Set(days());let d=new Date(todayMsk()+"T12:00:00Z"),c=0;if(!ds.has(d.toISOString().slice(0,10)))d.setUTCDate(d.getUTCDate()-1);while(ds.has(d.toISOString().slice(0,10))){c++;d.setUTCDate(d.getUTCDate()-1)}return c}
function nextLesson(){for(const l of CATALOG){if(!passed(l[0]))return l[0]}return 60}
function todayOfTest(n){const t=tests(n);return t.length?String(t[0][0]).slice(0,10):todayMsk()}
function dueCards(){const t=todayMsk(),out=[];for(const n in INDEX.cards){if(!taken(+n))continue;INDEX.cards[n].forEach(c=>{const st=S.cards[c.id];const due=st?st.due:addDays(todayOfTest(+n),1);if(due<=t)out.push({...c,n:+n})})}return out}
const BOX=[1,3,7,30];
function avgScore(){const b=CATALOG.map(l=>best(l[0])).filter(x=>x!==null);return b.length?Math.round(b.reduce((a,c)=>a+c,0)/b.length*100)+"%":"—"}

 tf:(it,st,a,v)=>{const[i,b]=v;st.a=st.a||[];if(st.a[i]===undefined)st.a[i]=b},
 pick:(it,st,a,v)=>{if(a==="tog"){st.sel=st.sel||[];const k=st.sel.indexOf(v);k>=0?st.sel.splice(k,1):st.sel.push(v)}else st.chk=true},
 match:(it,st,a,v)=>{if(a==="l"){st.sel=v;st.flash=undefined}else if(st.sel!==null&&st.sel!==undefined){if(v===st.sel){st.lock.push(v);st.sel=null;st.flash=undefined}else{st.err++;st.flash=v}}else toast("Сначала выбери карточку слева")},
 order:(it,st,a,v)=>{if(a==="check")st.chk=true;else{const j=a==="up"?v-1:v+1;[st.list[v],st.list[j]]=[st.list[j],st.list[v]]}},
 sort:(it,st,a,v)=>{if(a==="bin"){const ok=v===it.items[st.i||0].b;st.fb={ok};if(ok)st.sc=(st.sc||0)+1}else{st.fb=undefined;st.i=(st.i||0)+1}},
 estimate:(it,st,a)=>{if(a==="lock"){st.done=true;const lo=it.log?Math.log(it.min):it.min,hi=it.log?Math.log(it.max):it.max,pos=st.p??50,val=it.log?Math.exp(lo+(hi-lo)*pos/100):lo+(hi-lo)*pos/100;st.v=it.step?Math.round(val/it.step)*it.step:val}}
};
WA.spot=WA.pick;WD.spot=WD.pick;
function estMove(key,pos){const it=REG[key],st=wk(key);st.p=+pos;const lo=it.log?Math.log(it.min):it.min,hi=it.log?Math.log(it.max):it.max,val=it.log?Math.exp(lo+(hi-lo)*pos/100):lo+(hi-lo)*pos/100,v=it.step?Math.round(val/it.step)*it.step:val;const e=document.getElementById("ev_"+key);if(e)e.textContent=f1(v,it.dec??0)+" "+(it.unit||"")}

/* ===== PLAYER ===== */
let P=null,keepNext=false;
async function openLesson(n){
  try{const D=await loadLesson(n);WS={};REG={};P={n,D,i:0,t0:Date.now(),pick:{},q:{i:0,done:false,res:null}};drawPlayer()}
  catch(e){toast("Не удалось загрузить урок. Проверь интернет.")}
}
function closeLesson(){P=null;WS={};REG={};$("#layer").innerHTML="";document.body.style.overflow="";render()}
function redrawKeep(){keepNext=true;drawPlayer()}
function drawPlayer(){
  const D=P.D,st=D.steps[P.i],body=STEPS[st.t](st),last=P.i===D.steps.length-1;
  const pb0=$("#pbody"),sc=pb0?pb0.scrollTop:0;
  const hdr=P.n?`Урок ${P.n} · ${BLOCKS[CATALOG[P.n-1][1]]}`:P.hdr;
  $("#layer").innerHTML=`<div class="player ${P.shown?"":"enter"}" role="dialog" aria-label="${esc(hdr)}">
   <div class="phead"><div class="row"><button class="x" onclick="closeLesson()" aria-label="Закрыть">✕</button><div class="grow"><div class="eyebrow">${esc(hdr)}</div></div><span class="ls num">${P.i+1}/${D.steps.length}</span></div>
   <div class="seg">${D.steps.map((_,k)=>`<i class="${k<=P.i?"on":""}"></i>`).join("")}</div></div>
   <div class="pbody" id="pbody"><div class="pin">${body.html}</div></div>
   <div class="pfoot"><div class="in">${P.i>0&&!body.noback?`<button class="btn ghost" onclick="stepTo(-1)" aria-label="Назад">←</button>`:""}${body.foot||`<button class="btn block" onclick="${last?"closeLesson()":"stepTo(1)"}">${last?"Готово":"Дальше"}</button>`}</div></div></div>`;
  P.shown=true;document.body.style.overflow="hidden";const pb=$("#pbody");if(pb)pb.scrollTop=keepNext?sc:0;keepNext=false;
}
function stepTo(d){P.i=Math.max(0,Math.min(P.D.steps.length-1,P.i+d));drawPlayer()}
function readIdx(st){const rs=P.D.steps.filter(s=>s.t==="read");return [rs.indexOf(st)+1,rs.length]}
function playNext(){wk("p"+P.i).i++;drawPlayer()}
function storyPick(k){const g=wk("s"+P.i),st=P.D.steps[P.i],nd=st.nodes[g.node],ch=nd.ch[k];g.pick=k;Object.entries(ch.d||{}).forEach(([a,b])=>{g.vars[a].v=Math.round((g.vars[a].v+b)*100)/100});redrawKeep()}
function storyGo(){const g=wk("s"+P.i),st=P.D.steps[P.i];g.node=st.nodes[g.node].ch[g.pick].to;g.pick=undefined;drawPlayer()}
function storyReset(){delete WS["s"+P.i];drawPlayer()}

const STEPS={
 predict(st){
  const sel=P.pick[P.i],mins=P.D.minutes||{};
  return {html:`<div class="kicker">${esc(st.kicker||"История")}</div><h1 class="h">${esc(st.title)}</h1>
   <div class="lead">${st.lead}</div>
   ${P.D.minutes?`<div class="row" style="flex-wrap:wrap;gap:8px"><span class="rt">📖 Материал ≈ ${mins.read} мин</span><span class="rt">🎯 Практика ≈ ${mins.practice} мин</span><span class="rt">✅ Тест ≈ ${mins.test} мин</span></div>`:""}
   <div class="callout"><div class="eyebrow">Предскажи</div><b>${T(st.q)}</b></div>
   <div class="opts">${st.opts.map((o,k)=>`<button class="opt ${sel===undefined?"":k===st.correct?"good":k===sel?"wrong":""}" ${sel!==undefined?"disabled":""} onclick="P.pick[P.i]=${k};drawPlayer()">${T(o)}</button>`).join("")}</div>
   ${sel!==undefined?`<div class="callout ${sel===st.correct?"ok":"warm"} pop"><div class="eyebrow">${sel===st.correct?"Точно":"Почти никто не угадывает"}</div><div class="p">${st.reveal}</div></div>${st.after?`<div class="callout warm pop"><div class="eyebrow">${esc(st.afterTitle||"А в жизни")}</div><div class="p">${st.after}</div></div>`:""}`:""}`,
   foot:sel===undefined?`<button class="btn block" disabled>Выбери вариант</button>`:null};
 },
 read(st){
  const [i,n]=readIdx(st);
  return {html:`<div class="read stack" style="gap:16px"><div class="kicker">Материал · часть ${i} из ${n}</div><span class="rt">⏱ ≈ ${st.min} мин чтения</span><h1 class="h">${esc(st.title)}</h1>${st.html}</div>`};
 },
 hack(st){
  return {html:`<div class="hack"><div class="eyebrow">Лайфхак</div><h1 class="hname">${T(st.name)}</h1>${st.formula?`<div class="hform">${st.formula}</div>`:""}<p class="p" style="color:inherit">${st.what}</p></div>
   ${st.how?`<div class="card"><div class="eyebrow">Как пользоваться</div><ul class="hl">${st.how.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
   ${st.example?`<div class="callout"><div class="eyebrow">Пример на салфетке</div><p class="p">${st.example}</p></div>`:""}
   ${st.limit?`<div class="callout warm"><div class="eyebrow">Где ломается</div><p class="p">${st.limit}</p></div>`:""}`};
 },
 play(st){
  const g=wk("p"+P.i);g.i=g.i||0;const items=st.items,n=items.length,it=items[g.i],key=`p${P.i}.${g.i}`,w=wdraw(it,key),lastItem=g.i===n-1;
  let foot=w.foot;
  if(!foot)foot=w.done?(lastItem?`<button class="btn block" onclick="stepTo(1)">Дальше</button>`:`<button class="btn block" onclick="playNext()">Следующее задание</button>`):`<button class="btn block" disabled>Выполни задание</button>`;
  return {html:`<div class="kicker">${esc(st.kicker||"Задание")}${n>1?` · ${g.i+1} из ${n}`:""}</div><h1 class="h">${esc(st.title)}</h1>${st.intro&&g.i===0?`<div class="p">${st.intro}</div>`:""}${it.q?`<div class="qq">${T(it.q)}</div>`:""}${w.html}${w.done&&lastItem&&st.outro?`<div class="callout ok pop"><div class="eyebrow">Что из этого следует</div><div class="p">${st.outro}</div></div>`:""}`,foot};
 },
 story(st){
  const g=wk("s"+P.i);if(!g.node){g.node=st.start||"a";g.vars=JSON.parse(JSON.stringify(st.vars||{}));g.step=0}
  const nd=st.nodes[g.node],vs=Object.values(g.vars).map(v=>`<span class="vch"><small>${esc(v.label)}</small><b class="num">${f1(v.v,1)}${esc(v.unit||"")}</b></span>`).join("");
  let html=`<div class="kicker">${esc(st.kicker||"Игра")}</div><h1 class="h">${esc(st.title)}</h1>${st.intro&&g.node===(st.start||"a")?`<div class="p">${st.intro}</div>`:""}${vs?`<div class="vrow">${vs}</div>`:""}`;
  if(nd.end){
   html+=`<div class="callout ${nd.tone||"ok"} pop"><div class="eyebrow">${esc(nd.title||"Итог")}</div><div class="p">${nd.text}</div></div>${st.outro?`<div class="callout"><div class="eyebrow">Что из этого следует</div><div class="p">${st.outro}</div></div>`:""}`;
   return {html,foot:`<button class="btn ghost" onclick="storyReset()">Ещё раз</button><button class="btn block" onclick="stepTo(1)">Дальше</button>`};
  }
  html+=`<div class="card"><div class="p">${nd.text}</div></div><div class="opts">${nd.ch.map((c,k)=>`<button class="opt ${g.pick===undefined?"":k===g.pick?"sel":""}" ${g.pick!==undefined?"disabled":""} onclick="storyPick(${k})">${T(c.t)}</button>`).join("")}</div>`;
  if(g.pick!==undefined){const c=nd.ch[g.pick];html+=`<div class="callout ${c.tone||""} pop"><div class="eyebrow">Что произошло</div><div class="p">${c.fb}</div></div>`}
  return {html,foot:g.pick===undefined?`<button class="btn block" disabled>Сделай ход</button>`:`<button class="btn block" onclick="storyGo()">Дальше</button>`};
 },
 client(st){return {html:`<div class="kicker">Клиент</div><h1 class="h">${esc(st.title)}</h1>${st.html}`}},
 quizintro(){const t=P.test;return {html:`<div class="kicker">${esc(P.hdr)}</div><h1 class="h">${esc(t.title)}</h1><p class="p">${t.desc}</p><div class="callout"><div class="eyebrow">Правила</div><p class="p">${P.D.quiz.length} заданий разных типов, порог 70%. В тесте недели каждый урок представлен двумя вопросами; в итоговом больше вопросов по последним урокам. Подсказок нет, зато каждый ответ разбирается.</p></div>`,noback:true,foot:`<button class="btn block" onclick="stepTo(1)">Начать</button>`}},
 quiz(){
  const Q=P.D.quiz,q=P.q;
  if(q.done){const r=q.res;return {html:`<div class="kicker">Тест завершён</div><h1 class="h">${Math.round(r.pct*100)}%: ${f1(r.score,2)} из ${r.max}</h1><p class="p">Результат записан.</p>`,noback:true}}
  const it=Q[q.i],key="q"+q.i,w=wdraw(it,key);
  const foot=w.foot||(w.done?`<button class="btn block" onclick="nextQ()">${q.i===Q.length-1?"Завершить тест":"Дальше"}</button>`:`<button class="btn block" disabled>Ответь, чтобы продолжить</button>`);
  return {html:`<div class="kicker">Тест · ${q.i+1} из ${Q.length}${it.from?` · урок ${it.from}`:""}</div><h1 class="h" style="font-size:clamp(20px,5vw,26px)">${T(it.q)}</h1>${w.html}`,foot,noback:true};
 },
 tip(st){return {html:`<div class="kicker">Фишка для встречи</div><h1 class="h">Скажи это клиенту</h1>
   <div class="hero" style="border-radius:24px"><div class="eyebrow">Факт</div><h2>${esc(st.fact)}</h2><p>${esc(st.fact2||"")}</p></div>
   <div class="card"><div class="eyebrow">Вопрос клиенту</div><p class="p" style="font-size:19px;font-weight:700;margin-top:6px">${esc(st.question)}</p></div>
   <p class="ls">${esc(st.why||"")}</p>`}},
 wrap(st){const r=P.q.res;
  return {html:`<div class="kicker">Итог</div><h1 class="h">${r&&r.pct>=.7?"Урок пройден":"Урок записан, тему стоит повторить"}</h1>
   ${r?`<div class="card row"><div class="big num">${Math.round(r.pct*100)}%</div><div class="grow"><b>${f1(r.score,2)} из ${r.max}</b><div class="ls">Порог перехода — 70%</div></div></div>`:`<div class="callout warm">Пройди тест, чтобы результат записался.</div>`}
   <div class="callout"><div class="eyebrow">Что ты теперь умеешь</div><p class="p">${esc(st.can)}</p></div>
   <div class="eyebrow">Углубиться</div><div class="links">${(st.links||[]).map(l=>l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.title)}</b><span>${esc(l.sub||"")}</span></a>`:`<div class="mini" style="margin-bottom:8px"><span>${esc(l.kind||"Книга")}</span><b style="font-family:var(--ui);font-size:16px">${esc(l.title)}</b></div>`).join("")}</div>
   <div class="callout ok"><div class="eyebrow">Карточки</div><p class="p">${(INDEX.cards[P.n]||[]).length} карточек придут во вкладку «Повтор» завтра.</p></div>`};
 },
 twrap(){const r=P.q.res,miss=r?r.miss:[];
  return {html:`<div class="kicker">Итог</div><h1 class="h">${r&&r.pct>=.7?"Тест сдан":"Тест записан, есть что повторить"}</h1>
   ${r?`<div class="card row"><div class="big num">${Math.round(r.pct*100)}%</div><div class="grow"><b>${f1(r.score,2)} из ${r.max}</b><div class="ls">Порог — 70%. Можно пересдать: набор вопросов изменится.</div></div></div>`:""}
   ${miss.length?`<div class="callout warm"><div class="eyebrow">Где были ошибки</div>${miss.map(n=>`<button class="lrow" style="margin:8px 0 0" onclick="closeLesson();openLesson(${n})"><span class="lnum num">${n}</span><span class="grow lt">${esc(CATALOG[n-1][2])}</span></button>`).join("")}</div>`:`<div class="callout ok"><div class="eyebrow">Без пробелов</div><p class="p">Все темы закреплены.</p></div>`}`,noback:true};
 }
};
function nextQ(){
  const Q=P.D.quiz;
  if(P.q.i<Q.length-1){P.q.i++;drawPlayer();return}
  const per=Q.map((it,i)=>wscore(it,"q"+i));let score=Math.round(per.reduce((a,b)=>a+b,0)*100)/100;
  const sec=Math.round((Date.now()-P.t0)/1000);
  const miss=P.test?[...new Set(Q.filter((it,i)=>per[i]<.7).map(it=>it.from))].sort((a,b)=>a-b):[];
  P.q.res={score,max:Q.length,pct:score/Q.length,miss};P.q.done=true;
  if(P.test)addEvent(P.test.type,P.test.id,Q.length+" заданий",score,Q.length,sec);
  else addEvent("Тест",P.n,Q.length+" вопросов",score,Q.length,sec);
  P.i=P.D.steps.findIndex(s=>s.t==="tip"||s.t==="twrap");drawPlayer();
}
/* ===== TESTS: недели и итоговые ===== */
async function buildTest(type,id){
  const W=type==="Недельный",end=W?id*5:id*10,start=W?end-4:1,from=[];
  for(let n=start;n<=end;n++)from.push(n);
  const D=await Promise.all(from.map(loadLesson));
  const attempt=tests2(type,id).length,r=rng(type+id+"#"+attempt);
  const pool=n=>{const d=D[n-start];return [...(d.review||[]),...d.quiz].filter(x=>x.k!=="open").map(x=>({...x,from:n}))};
  let items=[];
  if(W){from.forEach(n=>{items.push(...shuf(pool(n),r).slice(0,2))});items=shuf(items,r)}
  else{
    const cand=[];from.forEach(n=>pool(n).forEach(x=>cand.push({x,w:n>end-5?4:n>end-10?2.5:1})));
    const k=Math.min(15,cand.length);
    for(let j=0;j<k;j++){const tot=cand.reduce((a,c)=>a+c.w,0);let t=r()*tot,i=0;while(i<cand.length-1&&(t-=cand[i].w)>0)i++;items.push(cand[i].x);const ln=cand[i].x.from;cand.splice(i,1)}
    items=shuf(items,r);
  }
  return items;
}
async function openTest(type,id){
  try{
    const W=type==="Недельный",items=await buildTest(type,id),end=W?id*5:id*10;
    const title=W?`Тест недели ${id}: уроки ${end-4}–${end}`:`Итоговый тест: уроки 1–${end}`;
    const desc=W?`Закрепляем неделю «${WEEKS[id-1]}». Вопросы собраны из всех пяти уроков недели.`:`Проверяем всё пройденное: от первого урока до ${end}-го. Самый большой вес у уроков ${end-4}–${end}, затем ${Math.max(1,end-9)}–${end-5}, остальные идут реже.`;
    WS={};REG={};
    P={n:null,hdr:W?`Тест недели ${id}`:`Итоговый тест ${end/10}`,test:{type,id,title,desc},D:{quiz:items,steps:[{t:"quizintro"},{t:"quiz"},{t:"twrap"}]},i:0,t0:Date.now(),pick:{},q:{i:0,done:false,res:null}};
    drawPlayer();
  }catch(e){toast("Не удалось собрать тест. Проверь интернет.")}
}
