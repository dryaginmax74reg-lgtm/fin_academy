  <div class="callout"><div class="eyebrow">Запомни</div><p class="p" style="font-size:17px">Суммы из разных дат нельзя сравнивать напрямую. Сначала приведи их к одной дате, и только потом решай.</p></div>
  </div>`}},
 read2(){return {html:`<div class="read stack" style="gap:16px">
  <div class="kicker">Материал · часть 2 из 4</div><span class="rt">⏱ ≈ 3 мин чтения</span>
  <h1 class="h">Сложный процент: почему срок важнее ставки</h1>
  <h2 class="rh">Простой и сложный</h2>
  <p><b>Простой процент</b> начисляется только на первоначальную сумму: положил 1 млн под 10% и получаешь 100 тыс. каждый год. <b>Сложный</b> начисляется на всю накопленную сумму, включая прошлые проценты. Каждый год капитал умножается на (1 + r), поэтому после t лет он умножен на (1 + r) в степени t.</p>
  <div class="formula">FV = PV × (1 + r)<sup>t</sup></div>
  <p>FV (future value) — будущая стоимость, PV (present value) — сегодняшняя сумма, r — ставка за период, t — число периодов. Эту формулу ты будешь использовать тысячи раз.</p>
  <h2 class="rh">Как расходятся две линии</h2>
  <p>1 млн ₽ под 10% годовых:</p>
  <div class="tblw"><table class="tbl"><thead><tr><th>Срок</th><th>Простой</th><th>Сложный</th></tr></thead><tbody>
  <tr><td>1 год</td><td>1,10</td><td>1,10</td></tr><tr><td>2 года</td><td>1,20</td><td>1,21</td></tr><tr><td>5 лет</td><td>1,50</td><td>1,61</td></tr><tr><td>10 лет</td><td>2,00</td><td>2,59</td></tr><tr><td>20 лет</td><td>3,00</td><td>6,73</td></tr><tr><td>30 лет</td><td>4,00</td><td class="hl">17,45</td></tr></tbody></table></div>
  <p>В первый год разницы нет. Через 10 лет сложный процент даёт на 30% больше. Через 30 лет — больше чем в 4 раза. Именно поэтому на длинной дистанции <b>срок важнее ставки</b>: клиент, который начал на 10 лет раньше, часто выигрывает у того, кто выбрал ставку повыше.</p>
  <h2 class="rh">Классический пример: Аня и Борис</h2>
  <p>Аня начинает в 25 лет: кладёт по 120 тыс. рублей в год десять лет подряд, потом перестаёт. Борис начинает в 35 и вносит те же 120 тыс. каждый год в течение тридцати лет. Ставка у обоих 8%, считаем по итогам 40 лет с момента старта Ани.</p>
  <div class="tblw"><table class="tbl"><thead><tr><th></th><th>Вложено</th><th>Итого</th></tr></thead><tbody>
  <tr><td>Аня (10 взносов)</td><td>1,2 млн</td><td class="hl">17,5 млн</td></tr><tr><td>Борис (30 взносов)</td><td>3,6 млн</td><td>13,6 млн</td></tr></tbody></table></div>
  <p>Аня вложила втрое меньше, а получила больше. Первые взносы работают дольше всех. Скажи клиенту просто: <b>время — единственный актив, который нельзя докупить</b>.</p>
  <div class="callout warm"><div class="eyebrow">Кейс: Баффет и кривая, которая почти вертикальна</div><p class="p" style="font-size:17px;margin-bottom:8px">По подсчёту писателя Моргана Хаузела, более 99% состояния Уоррена Баффета накоплено уже после его 50-летия. Начал он вкладывать ещё ребёнком, ему было около 11 лет. Секрет не в том, что с годами он стал гениальнее, а в форме кривой: последние годы сложный процент приносят больше, чем первые тридцать вместе взятые.</p><p class="p" style="font-size:17px;margin-bottom:8px">Вывод для клиента: если он в 55 лет спрашивает «а есть ли смысл ждать ещё десять лет», ответ часто такой: именно последние годы дают самый большой прирост. Прерывать горизонт ради небольшого удобства дорого.</p></div><div class="callout warm"><div class="eyebrow">Факт: облигация, которая платит четыре века</div><p class="p" style="font-size:17px;margin-bottom:8px">Голландский водный совет выпустил в XVII веке бессрочную облигацию: номинал не возвращают, купон платят вечно. По данным исследователей Йельского университета, платёж по ней продолжается до сих пор. Это и есть сложный процент в чистом виде: пока ставка и заёмщик живы, поток идёт столетиями.</p></div><h2 class="rh">Обратная сторона</h2>
  <p>Тот же механизм работает против тебя. Комиссия 1% в год кажется мелочью. Но если доходность 10%, а комиссия забирает 1 пункт, то за 30 лет итоговый капитал будет примерно на четверть меньше: (1,09 / 1,10)<sup>30</sup> ≈ 0,76. Комиссия, как и доход, начисляется «сложно». Запомни этот довод для разговора о фондах и управлении.</p>
  <div class="callout warm"><div class="eyebrow">Для щегольства, но осторожно</div><p class="p" style="font-size:17px">Фраза «сложный процент — восьмое чудо света, сказал Эйнштейн» звучит везде. Достоверных подтверждений авторства нет. Лучше не повторять её клиенту: образованный собеседник поймает.</p></div>
  </div>`}},
 read3(){return {html:`<div class="read stack" style="gap:16px">
  <div class="kicker">Материал · часть 3 из 4</div><span class="rt">⏱ ≈ 3 мин чтения</span>
  <h1 class="h">Три ставки: номинальная, эффективная, реальная</h1>
  <h2 class="rh">Номинальная и эффективная</h2>
  <p>Банк пишет «16% годовых». Но если проценты начисляются каждый месяц, то в конце года ты получишь больше, чем 16%: проценты на проценты начинают работать внутри года. Формула эффективной ставки при m начислениях в год:</p>
  <div class="formula">r<sub>эфф</sub> = (1 + r / m)<sup>m</sup> − 1</div>
  <div class="tblw"><table class="tbl"><thead><tr><th>16% номинал</th><th>Эффективная</th></tr></thead><tbody>
  <tr><td>раз в год</td><td>16,00%</td></tr><tr><td>ежемесячно</td><td class="hl">17,23%</td></tr><tr><td>ежедневно</td><td>17,35%</td></tr></tbody></table></div>
  <p>Разница в 1,2 пункта на 100 млн ₽ — это <b>1,2 млн рублей в год</b>. Поэтому, сравнивая два предложения, всегда приводи их к эффективной ставке.</p>
  <p>То же с вкладом 14%: при начислении раз в год эффективная ставка 14,00%, раз в квартал — 14,75%, ежемесячно — 14,93%. Если проценты выплачиваются на карту и не капитализируются, ты их теряешь для «сложного» роста. Поэтому условие капитализации иногда важнее, чем сама цифра в рекламе.</p>
  <p>В кредитах эту проблему решает регулятор: банк обязан показать <b>полную стоимость кредита (ПСК)</b>, то есть эффективную ставку с учётом комиссий и платежей. Сравнивать кредиты нужно по ней, а не по «ставке от».</p>
  <h2 class="rh">Реальная ставка: что остаётся после инфляции</h2>
  <p>Номинальная ставка показывает, сколько денег станет больше. Реальная — сколько станет больше <i>товаров</i>, которые можно на них купить. Точная формула (Фишера):</p>
  <div class="formula">r<sub>реал</sub> = (1 + r<sub>ном</sub>) / (1 + инфляция) − 1</div>
  <p>Допустим, вклад даёт 14%, а инфляция 8%. Реальная доходность — не 6%, а <b>5,6%</b>. Разница небольшая, но при высокой инфляции она растёт. Вспомни, что 1 млн ₽ при инфляции 8% через 10 лет покупает столько же, сколько сегодня 463 тыс.</p>
  <p>Ключевая ставка Банка России — 14% (по сообщениям, сохранена на заседании 23 октября). Это ориентир для всех рублёвых ставок: вклады, ОФЗ, кредиты. Если какой-то инструмент обещает заметно больше без объяснения причин, ищи, чем он за это платит: риском, ликвидностью или сроком.</p>
  <div class="callout warm"><div class="eyebrow">Кейс: как менялась цена денег в России</div><p class="p" style="font-size:17px;margin-bottom:8px">В октябре 1993 года ставка рефинансирования Банка России достигала 210%. В ночь на 16 декабря 2014 года ключевую ставку подняли сразу до 17%, пытаясь остановить обвал рубля. 28 февраля 2022 года — до 20%. 25 октября 2024 года — до 21%, максимум за много лет.</p><p class="p" style="font-size:17px;margin-bottom:8px">Сравнивать эти цифры напрямую нельзя. В 1993 году инфляция измерялась сотнями процентов в год, и 210% номинальных означали отрицательную реальную ставку: деньги в банке обесценивались быстрее, чем росли. В 2024 году при инфляции около 8–9% ставка 21% давала реальную доходность порядка 11–12% годовых: одну из самых высоких в мире.</p><p class="p" style="font-size:17px;margin-bottom:8px">Урок для разговора с клиентом: когда он говорит «раньше ставки были выше», спроси «какой инфляции». Только реальная ставка отвечает на вопрос, стало ли его богатство больше.</p></div><h2 class="rh">Правило 72</h2>
  <p>Быстрая прикидка срока удвоения без калькулятора: <b>72 делим на ставку в процентах</b>.</p>
  <div class="tblw"><table class="tbl"><thead><tr><th>Ставка</th><th>По правилу</th><th>Точно</th></tr></thead><tbody>
  <tr><td>6%</td><td>12 лет</td><td>11,9</td></tr><tr><td>9%</td><td>8 лет</td><td>8,0</td></tr><tr><td>12%</td><td>6 лет</td><td>6,1</td></tr><tr><td>36%</td><td>2 года</td><td>2,3</td></tr></tbody></table></div>
  <p>Работает лучше всего на ставках 6–12%. Для клиента это удобно: «при вашей доходности капитал удваивается примерно за столько-то лет».</p>
  </div>`}},
 read4(){return {html:`<div class="read stack" style="gap:16px">
  <div class="kicker">Материал · часть 4 из 4</div><span class="rt">⏱ ≈ 4 мин чтения</span>
  <h1 class="h">Дисконтирование и четыре ловушки</h1>
  <h2 class="rh">Обратная операция: сколько стоит обещание</h2>
  <p>Если сложный процент отвечает на вопрос «сколько будет», то дисконтирование — на вопрос «сколько это стоит сегодня».</p>
  <div class="formula">PV = FV / (1 + r)<sup>t</sup></div>
  <p>Покупатель обещает 150 млн ₽ через 5 лет. Что это стоит сегодня? Зависит от ставки дисконтирования:</p>
  <div class="tblw"><table class="tbl"><thead><tr><th>Ставка</th><th>Стоимость сегодня</th></tr></thead><tbody>
  <tr><td>8%</td><td>102,1 млн</td></tr><tr><td>12%</td><td>85,1 млн</td></tr><tr><td>15%</td><td class="hl">74,6 млн</td></tr></tbody></table></div>
  <p>Один и тот же платёж стоит от 75 до 102 млн. Ставка здесь — это <b>твоя оценка риска</b>. Обещание банка с залогом дисконтируют по низкой ставке, обещание частного покупателя без обеспечения — по высокой. Выбор ставки — это уже профессиональное суждение, а не арифметика.</p>
  <h2 class="rh">Это и есть оценка бизнеса</h2>
  <p>Любой потоковый актив оценивают одним способом: складывают будущие платежи, каждый пересчитанный в сегодняшние деньги. Пример: бизнес приносит 100 млн ₽ в год в течение 10 лет, ставка дисконтирования 15%. Его стоимость: 100/1,15 + 100/1,15² + … + 100/1,15¹⁰ ≈ <b>502 млн ₽</b>, хотя на бумаге 10 × 100 = 1 000. Половина «суммы» исчезла в дисконте.</p>
  <p>Теперь важное наблюдение. Для бессрочного потока в 100 млн стоимость равна 100 / r. При r = 15% получаем 667 млн, при 14% — 714 млн (+7%), при 16% — 625 млн (−6%). <b>Изменение ставки всего на один пункт двигает оценку на 6–7%.</b> Поэтому на переговорах о цене бизнеса спорят в основном не о прибыли, а о ставке дисконтирования. Ты будешь возвращаться к этому в уроках 28–30.</p>
  <h2 class="rh">Откуда берутся отложенные платежи</h2>
  <p>В реальных сделках продавец часто получает часть цены позже: после проверки бизнеса или при условии выполнения плана (такой механизм называют earn-out). Для советника это повод пересчитать «headline-цену» в сегодняшние деньги с поправкой на вероятность получить второй платёж. Именно это ты уже делал в кейсе про 350 + 350.</p>
  <div class="callout warm"><div class="eyebrow">Кейс: британские консоли и формула «купон / ставка»</div><p class="p" style="font-size:17px;margin-bottom:8px">С XVIII века Великобритания занимала деньги через бессрочные облигации, консоли (consols). Государство платит купон вечно, но номинал не возвращает. Цена такой бумаги определяется простейшей формулой: <b>купон / требуемая доходность</b>. Консоль с купоном 3,5 фунта стоила 100 фунтов, пока рынок требовал 3,5%. Когда доходности выросли до 7%, цена упала вдвое, до 50 фунтов. Бумага не изменилась, изменилась ставка.</p><p class="p" style="font-size:17px;margin-bottom:8px">Последние бессрочные британские займы, включая военный заём времён Первой мировой войны, были погашены уже в 2010-х годах. Это самая наглядная иллюстрация того, что цена обещания — это ставка, а не само обещание. Именно эта связь ляжет в основу урока про облигации.</p></div><h2 class="rh">Четыре ловушки</h2>
  <ul>
  <li><b>Среднее обманывает.</b> +50% и −50% в среднем дают 0%, а капитал падает на 25% (1,5 × 0,5 = 0,75). В отчётах считай среднегеометрическую доходность (CAGR): (итог / старт)<sup>1/t</sup> − 1.</li>
  <li><b>Ставка в таблице ≠ ставка в жизни.</b> Франклин посчитал на 5% и получил 131 тысячу. Реальность принесла потери по займам, расходы и более низкую ставку. Закладывай налоги, комиссии и считай несколько сценариев, а не одну цифру.</li>
  <li><b>Допущение о реинвестировании.</b> Формула предполагает, что весь доход тут же вложен под ту же ставку. Если купоны или дивиденды вкладывать под меньшую, итог будет ниже. В уроке про облигации ты увидишь, как это ломает доходность.</li>
  <li><b>Суммы без дат.</b> Самая частая ошибка в переговорах: «350 + 350 = 700, больше 600». Всегда спрашивай, когда придёт каждая часть.</li></ul>
  <h2 class="rh">Чек-лист советника: четыре вопроса к любой сумме</h2>
  <ul><li>Когда деньги придут?</li><li>Под какую ставку мы их пересчитываем и почему?</li><li>Ставка номинальная или реальная, до налогов или после?</li><li>Насколько надёжен платёж?</li></ul>
  <div class="callout ok"><div class="eyebrow">Что должно остаться в голове</div><p class="p" style="font-size:17px">FV = PV(1+r)<sup>t</sup> и PV = FV/(1+r)<sup>t</sup>. Эффективная ставка выше номинальной. Реальная ниже. 72 / ставка — срок удвоения. Среднее арифметическое врёт, геометрическое — нет. Суммы без дат сравнивать нельзя.</p></div>
  </div>`}},
 calc(){
  const c=P.calc,F=FV(c.pv,c.r,c.t,c.m),Fs=c.pv*(1+c.r/100*c.t),eff=(Math.pow(1+c.r/100/c.m,c.m)-1)*100;
  const pts=[],pts2=[];const N=Math.min(c.t,60);
  for(let i=0;i<=N;i++){const tt=c.t*i/N;pts.push([i/N,FV(c.pv,c.r,tt,c.m)]);pts2.push([i/N,c.pv*(1+c.r/100*tt)])}
  const mx=Math.max(F,Fs,1),W=600,H=180;
  const path=a=>a.map((p,i)=>(i?"L":"M")+(p[0]*(W-20)+10).toFixed(1)+" "+(H-12-(p[1]/mx)*(H-30)).toFixed(1)).join(" ");
  return {html:`
   <div class="kicker">Поиграй</div>
   <h1 class="h">Сложный процент: проценты на проценты</h1>
   <p class="p">Двигай ползунки. Смотри, как расходятся две линии: простой процент растёт по прямой, сложный — всё круче.</p>
   <div class="field"><label>Сумма <output>${f1(c.pv)} млн ₽</output></label><input type="range" min="0.5" max="10" step="0.5" value="${c.pv}" oninput="P.calc.pv=+this.value;updCalc()" aria-label="Сумма"></div>
   <div class="field"><label>Ставка в год <output>${f1(c.r)}%</output></label><input type="range" min="1" max="30" step="0.5" value="${c.r}" oninput="P.calc.r=+this.value;updCalc()" aria-label="Ставка"></div>
   <div class="field"><label>Срок <output>${c.t} лет</output></label><input type="range" min="1" max="40" step="1" value="${c.t}" oninput="P.calc.t=+this.value;updCalc()" aria-label="Срок"></div>
   <div class="field"><label>Капитализация</label><div class="pair"><button class="opt ${c.m===1?"sel":""}" onclick="P.calc.m=1;drawPlayer()">Раз в год</button><button class="opt ${c.m===12?"sel":""}" onclick="P.calc.m=12;drawPlayer()">Ежемесячно</button></div></div>
   <div id="calcout">${calcOut(F,Fs,eff,pts,pts2,mx,path,W,H)}</div>`};
 },
 baseOld(){
  return {html:`
   <div class="kicker">База</div><h1 class="h">Три формулы, на которых стоит вся финансовая математика</h1>
   <div class="formula">FV = PV × (1 + r)<sup>t</sup></div>
   <p class="p"><b>Будущая стоимость.</b> Сколько будут стоить сегодняшние деньги через t лет, если зарабатывают r в год.</p>
   <div class="formula">PV = FV / (1 + r)<sup>t</sup></div>
   <p class="p"><b>Приведённая (дисконтированная) стоимость.</b> Обратное действие: сколько сегодня стоит обещанная сумма. Ставка r здесь — цена ожидания и риска. Чем выше риск, тем выше r и тем меньше PV.</p>
   <div class="callout"><div class="eyebrow">Правило 72</div><p class="p">Время удвоения ≈ <b>72 / ставка в %</b>. При 6% — 12 лет, при 12% — 6 лет, при 24% — 3 года. Быстрая прикидка для разговора с клиентом.</p></div>
   <div class="callout warm"><div class="eyebrow">Ловушка №1: номинал и эффект</div><p class="p">Вклад «16% с ежемесячной капитализацией» приносит <b>17,23%</b> в год: (1 + 0,16/12)<sup>12</sup> − 1. Всегда сравнивай эффективные ставки.</p></div>
   <div class="callout warm"><div class="eyebrow">Ловушка №2: среднее обманывает</div><p class="p">+50% и −50% дают среднюю доходность 0%, а капитал — <b>−25%</b>. Для многолетних результатов считай среднегеометрическую: (итог/старт)<sup>1/t</sup> − 1.</p></div>`};
 },
 case(){
  const c=P.case,r=c.r/100,pvB=350+350/Math.pow(1+r,2)*(c.p/100);
  const ok=pvB>600,be=(Math.sqrt(350/250)-1)*100;
  return {html:`
   <div class="kicker">Кейс</div><h1 class="h">Продажа бизнеса: 600 сейчас или 350 + 350 через два года?</h1>
   <p class="p">Покупатель предлагает два варианта. Какой выгоднее? Зависит от ставки, по которой клиент может использовать деньги, и от того, насколько надёжен второй платёж. Ключевая ставка Банка России сейчас <b>${KEYRATE}%</b>.</p>
   <div class="field"><label>Ставка клиента (альтернатива) <output>${f1(c.r)}%</output></label><input type="range" min="0" max="30" step="0.5" value="${c.r}" oninput="P.case.r=+this.value;updCase()" aria-label="Ставка"></div>
   <div class="field"><label>Вероятность получить 2-й платёж <output>${c.p}%</output></label><input type="range" min="50" max="100" step="1" value="${c.p}" oninput="P.case.p=+this.value;updCase()" aria-label="Вероятность"></div>
   <div id="caseout">${caseOut(pvB,ok,be)}</div>`};
 },
 client(){
  return {html:`
   <div class="kicker">Клиент</div><h1 class="h">Знакомься: Андрей, владелец логистической компании</h1>
   <p class="p">Андрею 52, он строил бизнес 18 лет и впервые получил предложение о покупке. Он сильный в операциях и никогда не смотрел на деньги «во времени». С ним мы пройдём всю программу: от оценки до наследования.</p>
   <div class="card stack"><div class="eyebrow">Сегодня его вопрос</div><p class="p"><b>«Мне предлагают 600 сразу или 350 сейчас и 350 через два года. Второй вариант больше по сумме? Нет. Тогда зачем он вообще нужен?»</b></p></div>
   <div class="callout"><div class="eyebrow">Как ответить</div><p class="p">Не «посчитаем дисконт», а так: «Сумма во втором варианте та же, 700 против 600. Но деньги через два года вы получите не сегодня. Давайте выясним, сколько бы вы заработали на 350 млн за это время и насколько вы уверены в покупателе».</p></div>`};
 },
 quiz(){
  const Q=LESSONS[P.n].quiz,q=P.q;
  if(q.done)return quizResult();
  const item=Q[q.i];
  let inner="",foot="";
  const a=q.ans[q.i];
  if(item.k==="num"){
    inner=`<div class="field"><input type="number" inputmode="decimal" step="any" id="numin" value="${a!==undefined?a.v:""}" ${a!==undefined?"disabled":""} placeholder="Ответ, ${esc(item.unit)}" aria-label="Ответ"></div>`;
    if(a===undefined)foot=`<button class="btn block" onclick="answerNum()">Проверить</button>`;
  }else if(item.k==="choice"){
    inner=`<div class="opts">${item.opts.map((o,k)=>`<button class="opt ${a!==undefined?(k===item.ans?"good":k===a.v?"wrong":""):""}" ${a!==undefined?"disabled":""} onclick="answerChoice(${k})">${esc(o)}</button>`).join("")}</div>`;
  }else{
    inner=`<textarea id="opentxt" placeholder="Напиши ответ своими словами, как сказал бы клиенту" ${a!==undefined?"disabled":""}>${a!==undefined?esc(a.v):""}</textarea>`;
    if(a===undefined)foot=`<button class="btn block" onclick="answerOpen()">Показать эталон</button>`;
    else inner+=`<div class="callout ok pop"><div class="eyebrow">Эталонный ответ</div><p class="p">${esc(item.model)}</p></div><div class="eyebrow">Отметь, что ты учёл</div>${item.crit.map((c,k)=>`<button class="check ${q.crit[k]?"on":""}" onclick="P.q.crit[${k}]=!P.q.crit[${k}];drawPlayer()"><span class="bx">${q.crit[k]?"✓":""}</span><span>${esc(c)}</span></button>`).join("")}`;
  }
  if(a!==undefined&&item.k!=="open"){
    inner+=`<div class="callout ${a.ok?"ok":"bad"} pop"><div class="eyebrow">${a.ok?"Верно":"Не совсем"}</div><p class="p">${esc(item.why)}</p></div>`;
  }
  if(a!==undefined)foot=`<button class="btn block" onclick="nextQ()">${q.i===Q.length-1?"Завершить тест":"Дальше"}</button>`;
  return {html:`<div class="kicker">Тест · вопрос ${q.i+1} из ${Q.length} · ≈ 15 мин на весь тест</div><h1 class="h" style="font-size:clamp(20px,5vw,26px)">${esc(item.q)}</h1>${inner}`,foot};
 },
 tip(){
  return {html:`
   <div class="kicker">Фишка для встречи</div><h1 class="h">Скажи это клиенту</h1>
   <div class="hero" style="border-radius:24px"><div class="eyebrow">Факт</div><h2>Франклин рассчитал 131 000 фунтов из 1000. Реальный результат оказался в разы меньше.</h2><p>Хорошая формула без учёта потерь, комиссий и дефолтов даёт красивую, но нереальную цифру.</p></div>
   <div class="card"><div class="eyebrow">Вопрос клиенту</div><p class="p" style="font-size:19px;font-weight:700;margin-top:6px">«Если бы вам предложили эти деньги сегодня или с отсрочкой в два года, при какой ставке вы бы согласились подождать и откуда вы эту ставку берёте?»</p></div>
   <p class="ls">Почему это работает: клиент сам называет свою ставку дисконтирования. Дальше разговор строится вокруг его цифры.</p>`};
 },
 wrap(){
  const r=P.q.res;
  return {html:`
   <div class="kicker">Итог</div><h1 class="h">${r&&r.pct>=.7?"Урок пройден":"Урок записан, тему стоит повторить"}</h1>
   ${r?`<div class="card row"><div class="big num">${Math.round(r.pct*100)}%</div><div class="grow"><b>${f1(r.score,2)} из ${r.max}</b><div class="ls">Порог перехода — 70%</div></div></div>`:`<div class="callout warm">Пройди тест на предыдущем шаге, чтобы результат записался в таблицу.</div>`}
   <div class="callout"><div class="eyebrow">Что ты теперь умеешь</div><p class="p">Сравнивать суммы в разные даты, считать FV и PV, прикидывать срок удвоения по правилу 72, отличать эффективную ставку от номинальной и видеть ловушку среднего.</p></div>
   <div class="eyebrow">Углубиться (до трёх)</div>
   <div class="links">
    <a href="https://finance.mail.ru/article/slozhnyj-protsent-67915324/" target="_blank" rel="noopener"><b>Статья: сложный процент, формула и примеры</b><span>Читать · 10 минут · на русском</span></a>
    <a href="https://www.youtube.com/watch?v=Lw4TPL2G2ao" target="_blank" rel="noopener"><b>Видео: NPV, приведённая стоимость и дисконтирование на примере</b><span>YouTube · на русском</span></a>
    <div class="mini"><span>Книга</span><b style="font-family:var(--ui);font-size:16px">Брейли, Майерс. «Принципы корпоративных финансов», гл. 2–3</b></div>
   </div>
   <div class="callout ok"><div class="eyebrow">Карточки</div><p class="p">5 карточек придут во вкладку «Повтор» завтра.</p></div>`};
 }
};
function calcOut(F,Fs,eff,pts,pts2,mx,path,W,H){
  const c=P.calc;
  return `<div class="pair"><div class="mini"><span>Сложный процент</span><b class="num">${f1(F,2)} млн</b></div><div class="mini"><span>Простой процент</span><b class="num">${f1(Fs,2)} млн</b></div></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График роста"><path d="${path(pts2)}" fill="none" stroke="var(--fg3)" stroke-width="2.5" stroke-dasharray="6 6"/><path d="${path(pts)}" fill="none" stroke="var(--tint)" stroke-width="4" stroke-linecap="round"/></svg>
  <div class="callout"><div class="eyebrow">Разница</div><p class="p">Сложный процент добавил <b>${f1(F-Fs,2)} млн ₽</b> сверх простого. Эффективная ставка <b>${f1(eff,2)}%</b>, удвоение примерно за <b>${f1(72/c.r,1)}</b> лет по правилу 72.</p></div>`;
}
function updCalc(){
  const c=P.calc,F=FV(c.pv,c.r,c.t,c.m),Fs=c.pv*(1+c.r/100*c.t),eff=(Math.pow(1+c.r/100/c.m,c.m)-1)*100;
  const pts=[],pts2=[],N=Math.min(c.t,60);
  for(let i=0;i<=N;i++){const tt=c.t*i/N;pts.push([i/N,FV(c.pv,c.r,tt,c.m)]);pts2.push([i/N,c.pv*(1+c.r/100*tt)])}
  const mx=Math.max(F,Fs,1),W=600,H=180;
  const path=a=>a.map((p,i)=>(i?"L":"M")+(p[0]*(W-20)+10).toFixed(1)+" "+(H-12-(p[1]/mx)*(H-30)).toFixed(1)).join(" ");
  $("#calcout").innerHTML=calcOut(F,Fs,eff,pts,pts2,mx,path,W,H);
  document.querySelectorAll(".pin .field output").forEach((o,i)=>{o.textContent=[f1(c.pv)+" млн ₽",f1(c.r)+"%",c.t+" лет"][i]||o.textContent});
}
function caseOut(pvB,ok,be){
  const c=P.case;
  return `<div class="pair"><div class="mini"><span>Вариант А</span><b class="num">600 млн</b></div><div class="mini"><span>Вариант Б сегодня</span><b class="num">${f1(pvB,1)} млн</b></div></div>
  <div class="callout ${ok?"ok":"bad"}"><div class="eyebrow">Вердикт</div><p class="p">${ok?"Вариант Б стоит дороже: ждать выгодно.":"Вариант А выгоднее: деньги сегодня весомее."} Разница <b>${f1(Math.abs(pvB-600),1)} млн ₽</b>.</p></div>
  <p class="ls">Формула: 350 + 350 × вероятность / (1 + r)². Ставка безубыточности при 100% надёжности — <b>${f1(be,2)}%</b>. При ставке ${KEYRATE}% второй платёж должен быть надёжным минимум на <b>${f1(250*Math.pow(1+KEYRATE/100,2)/350*100,1)}%</b>.</p>`;
}
function updCase(){
  const c=P.case,r=c.r/100,pvB=350+350/Math.pow(1+r,2)*(c.p/100),ok=pvB>600,be=(Math.sqrt(350/250)-1)*100;
  $("#caseout").innerHTML=caseOut(pvB,ok,be);
  const o=document.querySelectorAll(".pin .field output");o[0].textContent=f1(c.r)+"%";o[1].textContent=c.p+"%";
}
function answerNum(){
  const v=parseFloat(String($("#numin").value).replace(",","."));if(isNaN(v)){toast("Введи число");return}
  const it=LESSONS[P.n].quiz[P.q.i];P.q.ans[P.q.i]={v,ok:Math.abs(v-it.ans)<=it.tol};drawPlayer();
}
function answerChoice(k){const it=LESSONS[P.n].quiz[P.q.i];P.q.ans[P.q.i]={v:k,ok:k===it.ans};drawPlayer()}
function answerOpen(){const v=$("#opentxt").value.trim();if(v.length<3){toast("Напиши хотя бы пару слов, потом сверимся с эталоном");return}P.q.ans[P.q.i]={v,ok:true};P.q.crit=[];drawPlayer()}
function nextQ(){
  const Q=LESSONS[P.n].quiz;
  if(P.q.i<Q.length-1){P.q.i++;drawPlayer();return}
  let score=0;Q.forEach((it,i)=>{const a=P.q.ans[i];if(it.k==="open")score+=P.q.crit.filter(Boolean).length/it.crit.length;else if(a&&a.ok)score++});
  score=Math.round(score*100)/100;
  const sec=Math.round((Date.now()-P.t0)/1000);
  P.q.res={score,max:Q.length,pct:score/Q.length};P.q.done=true;
  addEvent("Тест",P.n,"6 вопросов",score,Q.length,sec);
  const t=P.q.ans[Q.length-1];if(t)addEvent("Открытый",P.n,"критериев "+P.q.crit.filter(Boolean).length+" из "+Q[Q.length-1].crit.length,P.q.crit.filter(Boolean).length,Q[Q.length-1].crit.length);
  P.i=LESSONS[P.n].steps.findIndex(s=>s.t==="tip");drawPlayer();
}
function quizResult(){const r=P.q.res;return {html:`<div class="kicker">Тест завершён</div><h1 class="h">${Math.round(r.pct*100)}%: ${f1(r.score,2)} из ${r.max}</h1><p class="p">Результат записан. Дальше фишка для встречи.</p>`}}
function toast(m){const t=document.createElement("div");t.className="toast pop";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ===== BOOT ===== */
render();
if(window.claude&&claude.use){
  claude.use("mcp").then(m=>{mcp=m;if(m){setSync("","Подключаю таблицу…");pull()}else setSync("off","Только на этом устройстве")}).catch(()=>{});
}
</script>
</body></html>
