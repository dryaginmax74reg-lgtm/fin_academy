
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101923">
  <title>FINLAB — Академия инвестиций</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101923;
      --card: #192633;
      --border: #2c3b49;
      --text: #f1f5f9;
      --muted: #9aabba;
      --accent: #64d6ae;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    header {
      padding: 24px 18px 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 { font-size: 26px; margin: 8px 0; }
    h2 { font-size: 20px; margin-top: 0; }
    h3 { font-size: 16px; margin-bottom: 6px; }
    .muted { color: var(--muted); }

    main {
      max-width: 760px;
      margin: auto;
      padding: 18px;
    }

    nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      background: var(--card);
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    button.active,
    button.primary {
      background: var(--accent);
      color: #10231d;
      border-color: var(--accent);
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    .lesson {
      width: 100%;
      display: block;
      text-align: left;
      margin: 8px 0;
    }

    .lesson small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .lesson.active small { color: #183d31; }

    .content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .error { border-color: #a94b55; }

    .tag {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 8px;
      background: #233c3a;
      color: var(--accent);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .progress {
      height: 6px;
      background: var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress span {
      display: block;
      height: 100%;
      background: var(--accent);
    }

    a { color: var(--accent); }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">FINLAB</div>
    <h1>Академия инвестиций</h1>
    <div class="muted">Системное обучение финансовой грамотности</div>
  </header>

  <main>
    <nav>
      <button id="todayTab" class="active" onclick="showTab('today')">
        Обучение
      </button>
      <button id="roadmapTab" onclick="showTab('roadmap')">
        План курса
      </button>
    </nav>

    <div id="status" class="card">Загружаю материалы курса…</div>
    <section id="todayView"></section>
    <section id="roadmapView" hidden></section>
  </main>

  <footer>FINLAB · Академия инвестиций</footer>

  <script>
    const state = {
      lessons: [],
      roadmap: null,
      selected: 0,
      tab: "today"
    };

    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function showTab(tab) {
      state.tab = tab;

      $("todayView").hidden = tab !== "today";
      $("roadmapView").hidden = tab !== "roadmap";

      $("todayTab").classList.toggle("active", tab === "today");
      $("roadmapTab").classList.toggle("active", tab === "roadmap");
    }

    function titleOf(item, fallback) {
      if (typeof item === "string") return item;

      return item?.title ||
        item?.name ||
        item?.lesson_title ||
        item?.topic ||
        fallback;
    }

    function normalizeLessons(data) {
      if (Array.isArray(data)) return data;

      if (Array.isArray(data?.lessons)) return data.lessons;
      if (Array.isArray(data?.items)) return data.items;

      if (Array.isArray(data?.modules)) {
        return data.modules.flatMap((module, index) =>
          Array.isArray(module.lessons)
            ? module.lessons.map(lesson => ({
                ...lesson,
                module: lesson.module ||
                  module.title ||
                  module.name ||
                  `Модуль ${index + 1}`
              }))
            : []
        );
      }

      return [];
    }

    function lessonBody(lesson) {
      if (typeof lesson === "string") {
        return `<div class="content">${escapeHtml(lesson)}</div>`;
      }

      const fields = [
        ["description", "Описание"],
        ["intro", "Введение"],
        ["content", "Материал"],
        ["text", "Текст урока"],
        ["body", "Материал"],
        ["theory", "Теория"],
        ["explanation", "Объяснение"],
        ["summary", "Кратко"],
        ["task", "Задание"],
        ["exercise", "Практика"],
        ["question", "Вопрос"]
      ];

      const sections = fields
        .filter(([key]) => lesson?.[key] != null)
        .map(([key, label]) => {
          const value = lesson[key];

          const content = typeof value === "object"
            ? JSON.stringify(value, null, 2)
            : value;

          return `<h3>${label}</h3>
            <div class="content">${escapeHtml(content)}</div>`;
        });

      if (!sections.length) {
        sections.push(
          `<div class="content">${
            escapeHtml(JSON.stringify(lesson, null, 2))
          }</div>`
        );
      }

      return sections.join("");
    }

    function renderLessons() {
      const root = $("todayView");

      if (!state.lessons.length) {
        root.innerHTML = `
          <div class="card">
            Уроки не найдены. Проверь структуру файла lessons.json.
          </div>`;
        return;
      }

      state.selected = Math.min(
        state.selected,
        state.lessons.length - 1
      );

      const lesson = state.lessons[state.selected];
      const progress = Math.round(
        ((state.selected + 1) / state.lessons.length) * 100
      );

      root.innerHTML = `
        <div class="card">
          <div class="tag">
            УРОК ${state.selected + 1} ИЗ ${state.lessons.length}
          </div>

          <h2>${escapeHtml(
            titleOf(lesson, `Урок ${state.selected + 1}`)
          )}</h2>

          <div class="progress">
            <span style="width:${progress}%"></span>
          </div>

          ${lesson?.module
            ? `<p class="muted">${escapeHtml(lesson.module)}</p>`
            : ""}

          ${lessonBody(lesson)}

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px">
            <button
              onclick="changeLesson(-1)"
              ${state.selected === 0 ? "disabled" : ""}>
              ← Назад
            </button>

            <button
              class="primary"
              onclick="changeLesson(1)"
              ${state.selected === state.lessons.length - 1
                ? "disabled"
                : ""}>
              Следующий урок →
            </button>
          </div>
        </div>

        <div class="card">
          <h2>Все уроки</h2>

          ${state.lessons.map((item, index) => `
            <button
              class="lesson ${index === state.selected ? "active" : ""}"
              onclick="selectLesson(${index})">
              ${index + 1}. ${escapeHtml(
                titleOf(item, `Урок ${index + 1}`)
              )}
              <small>${escapeHtml(
                item?.module || item?.category || "Материал курса"
              )}</small>
            </button>
          `).join("")}
        </div>`;
    }

    function changeLesson(delta) {
      state.selected = Math.max(
        0,
        Math.min(
          state.lessons.length - 1,
          state.selected + delta
        )
      );

      renderLessons();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectLesson(index) {
      state.selected = index;
      renderLessons();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderRoadmap() {
      const root = $("roadmapView");
      const data = state.roadmap;

      if (!data) {
        root.innerHTML = `
          <div class="card">Дорожная карта недоступна.</div>`;
        return;
      }

      const entries = Array.isArray(data)
        ? data
        : Array.isArray(data.daily_sequence)
          ? data.daily_sequence
          : Array.isArray(data.days)
            ? data.days
            : Array.isArray(data.items)
              ? data.items
              : Array.isArray(data.weeks)
                ? data.weeks
                : null;

      if (!entries) {
        root.innerHTML = `
          <div class="card">
            <h2>${escapeHtml(titleOf(data, "Дорожная карта курса"))}</h2>
            <div class="content">${escapeHtml(
              JSON.stringify(data, null, 2)
            )}</div>
          </div>`;
        return;
      }

      root.innerHTML = `
        <div class="card">
          <h2>План обучения</h2>
          <p class="muted">Этапов в плане: ${entries.length}</p>
        </div>

        ${entries.map((entry, index) => {
          const label = entry?.day
            ? `ДЕНЬ ${entry.day}`
            : entry?.week
              ? `НЕДЕЛЯ ${entry.week}`
              : `ЭТАП ${index + 1}`;

          const description =
            entry?.description ||
            entry?.content ||
            entry?.topic ||
            entry?.task ||
            entry?.goal ||
            "";

          return `
            <div class="card">
              <div class="tag">${escapeHtml(label)}</div>
              <h2>${escapeHtml(
                titleOf(entry, `Этап ${index + 1}`)
              )}</h2>
              <div class="content">${escapeHtml(
                typeof description === "object"
                  ? JSON.stringify(description, null, 2)
                  : description || (
                    typeof entry === "string" ? entry : ""
                  )
              )}</div>
            </div>`;
        }).join("")}`;
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`${url}: HTTP ${response.status}`);
      }

      const raw = await response.text();

      try {
        return JSON.parse(raw);
      } catch {
        throw new Error(`${url}: файл не является корректным JSON`);
      }
    }

    async function loadCourseFile(filename) {
      const bases = [
        "/fin_academy/course/",
        "../course/",
        "./course/"
      ];

      let lastError;

      for (const base of bases) {
        try {
          return await fetchJson(base + filename);
        } catch (error) {
          lastError = error;
          console.warn("Не удалось загрузить", base + filename);
        }
      }

      throw lastError || new Error(
        "Не удалось найти файл " + filename
      );
    }

    async function init() {
      $("status").hidden = false;
      $("status").className = "card";
      $("status").textContent = "Загружаю материалы курса…";

      try {
        if (window.Telegram?.WebApp) {
          Telegram.WebApp.ready();
          Telegram.WebApp.expand();

          try {
            Telegram.WebApp.setHeaderColor("#101923");
            Telegram.WebApp.setBackgroundColor("#101923");
          } catch (_) {}
        }

        const [lessonsData, roadmapData] = await Promise.all([
          loadCourseFile("lessons.json"),
          loadCourseFile("roadmap.json")
        ]);

        state.lessons = normalizeLessons(lessonsData);
        state.roadmap = roadmapData;

        $("status").hidden = true;

        renderLessons();
        renderRoadmap();
        showTab("today");

      } catch (error) {
        console.error("FINLAB loading error:", error);

        $("status").hidden = false;
        $("status").className = "card error";

        $("status").innerHTML = `
          <h2>Не удалось загрузить курс</h2>
          <p>Не удалось загрузить файлы курса из GitHub Pages.</p>

          <p>
            <a href="/fin_academy/course/lessons.json" target="_blank">
              Открыть lessons.json
            </a>
          </p>

          <p>
            <a href="/fin_academy/course/roadmap.json" target="_blank">
              Открыть roadmap.json
            </a>
          </p>

          <p class="muted">${escapeHtml(error.message || error)}</p>

          <button onclick="init()">Повторить загрузку</button>`;
      }
    }

    init();
  </script>
</body>
</html>
