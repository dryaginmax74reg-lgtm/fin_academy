<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>FINLAB — академия инвестиций</title><style>
:root{color-scheme:dark;--bg:#101923;--card:#192633;--line:#2b3d4d;--text:#edf3f7;--muted:#9eb0bf;--accent:#7de0c3;--gold:#f2c879}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:22px 18px 14px;max-width:900px;margin:auto}header .brand{letter-spacing:.18em;color:var(--accent);font-weight:800;font-size:13px}header h1{margin:5px 0;font-size:28px}header p,.muted{color:var(--muted)}main{max-width:900px;margin:auto;padding:0 14px 110px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:10px max(10px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));background:#101923ed;border-top:1px solid var(--line);z-index:10}.nav button{flex:1;max-width:160px;background:transparent;border:0;color:var(--muted);padding:10px 5px;border-radius:10px;font-size:13px}.nav button.active{background:#263b49;color:var(--accent)}.card,.article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.label{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}.tag{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:3px 9px;color:var(--muted);font-size:12px;margin:4px 4px 4px 0}h2{font-size:23px;line-height:1.25;margin:8px 0}h3{font-size:17px;margin:8px 0}p{margin:8px 0 12px}.btn{background:var(--accent);color:#10211f;border:0;border-radius:10px;padding:12px 15px;font-weight:750;cursor:pointer}.btn.secondary{background:#263947;color:var(--text);border:1px solid var(--line)}.btn.full{width:100%;margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.progress{height:7px;background:#31414e;border-radius:8px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--accent)}.lessonlist{display:grid;gap:8px}.lessonitem{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer}.lessonitem h3{margin:0;font-size:15px}.lessonitem p{font-size:12px;color:var(--muted);margin:4px 0 0}.num{font-size:11px;color:var(--accent);min-width:55px}.done{color:var(--accent);margin-left:auto}.search{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#101923;color:var(--text);margin:12px 0}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:15px}.formula{background:#101923;border-radius:10px;padding:14px;color:var(--gold);font-family:ui-monospace,monospace;overflow-wrap:anywhere}.source{display:inline-block;color:var(--accent);margin:5px 12px 4px 0}.quizq{padding:13px 0;border-bottom:1px solid var(--line)}.option{display:flex;gap:9px;padding:9px;border-radius:9px;background:#101923;margin:6px 0;cursor:pointer}.option input{accent-color:var(--accent)}.feedback{padding:12px;border-radius:9px;margin:10px 0}.hidden{display:none!important}.good{background:#173d34;color:#baf4df}.bad{background:#472a2d;color:#ffd0d0}.small{font-size:12px;color:var(--muted)}textarea{width:100%;min-height:110px;background:#101923;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.empty{padding:22px;text-align:center;color:var(--muted)}
</style></head><body><header><div class="brand">FINLAB / PRIVATE LEARNING</div><h1>Академия инвестиций</h1><p>20–30 минут в день. Понять механизм → посчитать → проверить → применить.</p></header><main><section id="view-today"></section><section id="view-course" class="hidden"></section><section id="view-exam" class="hidden"></section><section id="view-notes" class="hidden"></section></main><nav class="nav"><button data-tab="today" class="active" onclick="switchTab('today')">Сегодня</button><button data-tab="course" onclick="switchTab('course')">Курс</button><button data-tab="exam" onclick="switchTab('exam')">Экзамен</button><button data-tab="notes" onclick="switchTab('notes')">Заметки</button></nav><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={lessons:[],roadmap:[],current:null,tab:'today',done:new Set(),scores:{},notes:''};function save(){try{localStorage.setItem('finlab-v1',JSON.stringify({done:[...state.done],scores:state.scores,notes:state.notes}))}catch(e){}}function loadSaved(){try{const x=JSON.parse(localStorage.getItem('finlab-v1')||'{}');state.done=new Set(x.done||[]);state.scores=x.scores||{};state.notes=x.notes||''}catch(e){}}
async function init(){try{const [l,r]=await Promise.all([fetch('./course/lessons.json').then(x=>{if(!x.ok)throw Error('lessons');return x.json()}),fetch('./course/roadmap.json').then(x=>{if(!x.ok)throw Error('roadmap');return x.json()})]);if(!Array.isArray(l)||!Array.isArray(r.daily_sequence)||!l.length)throw Error('format');state.lessons=l;state.roadmap=r.daily_sequence;loadSaved();if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();try{Telegram.WebApp.setHeaderColor('#101923');Telegram.WebApp.setBackgroundColor('#101923')}catch(e){}}renderAll()}catch(e){$('#view-today').innerHTML='<div class="card"><h2>Не удалось загрузить курс</h2><p>Проверьте, что папка course с файлами lessons.json и roadmap.json загружена рядом с miniapp, а GitHub Pages опубликован из корня репозитория.</p><p class="small">Ожидаются: ./course/lessons.json и ./course/roadmap.json</p></div>'}}
function todayLesson(){let start=new Date('2026-10-21T00:00:00Z'),now=new Date(),n=Math.max(0,Math.floor((Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-start.getTime())/86400000));if(n<state.lessons.length)return state.lessons[n];const t=state.roadmap[(n-state.lessons.length)%state.roadmap.length];return {id:'PLAN-'+String(n+1).padStart(3,'0'),month:t.month,week:'план',day:'—',title:t.title,hook:t.hook,minutes:25,body:'Сегодня изучите тему по шагам: определите механизм, проверьте предпосылки, посчитайте пример и сформулируйте, что может изменить вывод. Это плановый день; полный учебный материал доступен в стартовых уроках.',formula:t.formula,case:t.case,advisor_application:'Сформулируйте, что тема меняет в анализе активов и какие вопросы задать клиенту.',quiz:[],sources:t.sources.map((u,i)=>({name:['Банк России','CFA Institute','IMF'][i]||'Источник',url:u}))}}
function renderAll(){renderToday();renderCourse();renderExam();renderNotes()}function switchTab(t){state.tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('main>section').forEach(v=>v.classList.add('hidden'));$('#view-'+t).classList.remove('hidden');if(t==='today'&&state.current)renderLesson();if(t==='course')renderCourse();if(t==='exam')renderExam();if(t==='notes')renderNotes();window.scrollTo({top:0,behavior:'smooth'})}
function section(label,content){return `<div class="section"><h3>${label}</h3>${content}</div>`}function openLesson(id){state.current=id;switchTab('today');renderLesson()}function renderLesson(){const x=state.lessons.find(a=>a.id===state.current)||todayLesson();$('#view-today').innerHTML=`<div class="row"><button class="btn secondary" onclick="state.current=null;switchTab('course')">← К списку уроков</button><span class="tag">${esc(x.id)}</span><span class="tag">${x.minutes||25} минут</span></div><article class="article"><div class="label">Модуль ${esc(x.month)} · Неделя ${esc(x.week)}</div><h2>${esc(x.title)}</h2><p class="muted">${esc(x.hook)}</p>${section('Материал',`<p>${esc(x.body).replace(/\n\n/g,'</p><p>')}</p>`)}${section('Формула / расчёт',`<div class="formula">${esc(x.formula)}</div>`)}${section('Исторический или рыночный кейс',`<p>${esc(x.case)}</p>`)}${section('Практика советника',`<p>${esc(x.advisor_application)}</p>`)}${section('Источники',x.sources.map(s=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(''))}${x.quiz?.length?`<div class="section"><h3>Проверка понимания</h3>${x.quiz.map((q,i)=>`<div class="quizq"><h4>${i+1}. ${esc(q.q)}</h4>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}<div class="feedback hidden" id="fb${i}"></div></div>`).join('')}<button class="btn full" onclick="grade('${x.id}')">Проверить ответы</button><div id="result" class="feedback hidden"></div></div>`:'<div class="section"><h3>Самостоятельная практика</h3><p>Запишите вывод, выполните расчёт и сравните два сценария.</p></div>'}<button class="btn full" onclick="toggleDone('${x.id}')">${state.done.has(x.id)?'✓ Урок пройден — снять отметку':'Отметить как пройденный'}</button></article>`}
function renderToday(){if(state.current){renderLesson();return}let x=todayLesson();$('#view-today').innerHTML=`<div class="grid"><div class="card"><div class="label">Урок дня · ${esc(x.id)}</div><h2>${esc(x.title)}</h2><p class="muted">${esc(x.hook)}</p><span class="tag">${x.minutes} минут</span><span class="tag">Модуль ${x.month}</span><button class="btn full" onclick="openLesson('${x.id.startsWith('PLAN-')?state.lessons[0].id:x.id}')">Начать урок →</button></div><div class="card"><div class="label">Твой прогресс</div><h3>${state.done.size} из ${state.lessons.length} уроков</h3><div class="progress"><div style="width:${Math.min(100,state.done.size/state.lessons.length*100)}%"></div></div><p class="muted">Решай тесты, считай руками и записывай, как механизм влияет на инвестиционное решение.</p><button class="btn secondary full" onclick="switchTab('course')">Продолжить курс</button></div></div><div class="card"><div class="label">Метод FINLAB</div><h3>Понять механизм → посчитать → проверить на истории → применить к клиенту</h3><p class="muted">В архиве 30 стартовых уроков с тестами и годовая карта на 365 дней.</p></div><div class="card"><h3>Недавно изучали</h3>${state.lessons.filter(a=>state.done.has(a.id)).slice(-3).reverse().map(a=>`<div class="lessonitem" onclick="openLesson('${a.id}')"><div class="num">${a.id}</div><div><h3>${esc(a.title)}</h3><p>Открыть урок</p></div><span class="done">✓</span></div>`).join('')||'<p class="muted">Пока нет пройденных уроков. Начни с урока дня.</p>'}</div>`}
function renderCourse(filter=''){const q=filter.toLowerCase();const list=state.lessons.filter(x=>(x.title+' '+x.hook+' '+x.body).toLowerCase().includes(q));$('#view-course').innerHTML=`<div class="card"><div class="label">Учебная программа</div><h2>Каталог уроков</h2><p class="muted">30 стартовых уроков с материалом и тестами. Годовая карта — 365 тем.</p><input class="search" id="search" placeholder="Найти тему: облигации, инфляция, DCF…" value="${esc(filter)}" oninput="renderCourse(this.value)"><div class="row"><span class="tag">${list.length} уроков</span><span class="tag">${state.done.size} завершено</span></div></div><div class="lessonlist">${list.map(x=>`<div class="lessonitem" onclick="openLesson('${x.id}')"><div class="num">${x.id}</div><div><h3>${esc(x.title)}</h3><p>Модуль ${x.month} · ${x.minutes} минут · ${esc(x.hook)}</p></div>${state.done.has(x.id)?'<span class="done">✓</span>':''}</div>`).join('')||'<div class="empty">Ничего не найдено</div>'}</div>`}
function grade(id){const x=state.lessons.find(a=>a.id===id);let score=0;x.quiz.forEach((q,i)=>{const p=document.querySelector(`input[name="q${i}"]:checked`),fb=$('#fb'+i);fb.classList.remove('hidden','good','bad');if(!p){fb.classList.add('bad');fb.textContent='Не отвечено. '+q.explanation;return}const ok=Number(p.value)===q.answer;if(ok)score++;fb.classList.add(ok?'good':'bad');fb.innerHTML=`<b>${ok?'Верно':'Неверно'}.</b> Правильный ответ: ${esc(q.options[q.answer])}<br>${esc(q.explanation)}`});const r=$('#result');r.classList.remove('hidden');r.classList.add(score>=Math.ceil(x.quiz.length*.7)?'good':'bad');r.innerHTML=`Результат: <b>${score} из ${x.quiz.length}</b>. ${score===x.quiz.length?'Отлично — все ответы верны.':'Разберите ошибки и повторите материал.'}`;state.scores[id]={score,total:x.quiz.length,date:new Date().toISOString()};save()}
function toggleDone(id){state.done.has(id)?state.done.delete(id):state.done.add(id);save();renderAll();if(state.current)renderLesson()}function renderExam(){let pool=state.lessons.flatMap(x=>x.quiz.map((q,i)=>({...q,lesson:x.id,title:x.title,qi:i})));pool.sort((a,b)=>(a.lesson+a.qi).localeCompare(b.lesson+b.qi));pool=pool.slice(0,10);$('#view-exam').innerHTML=`<div class="card"><div class="label">Weekly challenge</div><h2>Экзамен недели</h2><p class="muted">10 смешанных вопросов из стартовых уроков. Ключ появится после проверки.</p><span class="tag">10 вопросов</span><span class="tag">10–15 минут</span></div><div class="article">${pool.map((q,i)=>`<div class="quizq" data-exam="${i}" data-lesson="${q.lesson}" data-qi="${q.qi}"><h4>${i+1}. ${esc(q.q)}</h4><p class="small">${esc(q.title)}</p>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="e${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}<div class="feedback hidden" id="ef${i}"></div></div>`).join('')}<button class="btn full" onclick="gradeExam()">Проверить экзамен</button><div id="examresult" class="feedback hidden"></div></div>`}function gradeExam(){let score=0;document.querySelectorAll('[data-exam]').forEach((el,i)=>{const lesson=state.lessons.find(x=>x.id===el.dataset.lesson),q=lesson.quiz[Number(el.dataset.qi)],p=document.querySelector(`input[name="e${i}"]:checked`),fb=$('#ef'+i);fb.classList.remove('hidden','good','bad');if(!p){fb.classList.add('bad');fb.textContent='Не отвечено. '+q.explanation;return}const ok=Number(p.value)===q.answer;if(ok)score++;fb.classList.add(ok?'good':'bad');fb.innerHTML=`<b>${ok?'Верно':'Неверно'}.</b> ${esc(q.options[q.answer])}<br>${esc(q.explanation)}`});const r=$('#examresult');r.classList.remove('hidden');r.classList.add(score>=7?'good':'bad');r.innerHTML=`<b>Результат: ${score}/10</b> · ${score>=9?'Отлично':score>=7?'Хороший результат':'Повтори темы с ошибками'}.`;state.scores.exam={score,total:10,date:new Date().toISOString()};save()}function renderNotes(){$('#view-notes').innerHTML=`<div class="card"><div class="label">Личное пространство</div><h2>Мои заметки</h2><p class="muted">Записывай выводы, вопросы и идеи для применения в работе. Заметки сохраняются в браузере этого устройства.</p><textarea id="notes" placeholder="Что понял? Что проверить? Как применить к клиентскому кейсу?">${esc(state.notes)}</textarea><button class="btn full" onclick="state.notes=$('#notes').value;save();$('#noteStatus').textContent='Сохранено на этом устройстве'">Сохранить заметки</button><p id="noteStatus" class="small"></p><button class="btn secondary full" onclick="exportProgress()">Экспортировать прогресс и заметки</button><input type="file" id="importFile" accept="application/json" class="search" onchange="importProgress(event)"><p class="small">Можно экспортировать JSON и затем импортировать его на другом устройстве.</p></div>`;$('#notes').addEventListener('input',()=>{state.notes=$('#notes').value;save()})}function exportProgress(){const blob=new Blob([JSON.stringify({done:[...state.done],scores:state.scores,notes:state.notes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finlab-progress.json';a.click();URL.revokeObjectURL(a.href)}function importProgress(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state.done=new Set(x.done||[]);state.scores=x.scores||{};state.notes=x.notes||'';save();renderAll();alert('Прогресс импортирован')}catch(e){alert('Не удалось прочитать файл')}};r.readAsText(f)}init();
</script></body></html>
