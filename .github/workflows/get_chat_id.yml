
name: Get Telegram Chat ID

on:
  workflow_dispatch:

jobs:
  get-chat-id:
    runs-on: ubuntu-latest
    steps:
      - name: Show instructions
        run: |
          echo "Open your Telegram bot and send /start."
          echo "Then open this URL in your browser:"
          echo "https://api.telegram.org/bot<YOUR_BOT_TOKEN>/getUpdates"
          echo "Find message.chat.id in the response."
